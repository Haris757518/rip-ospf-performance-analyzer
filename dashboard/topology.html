<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive routing lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#dce7f3;font:14px Arial,sans-serif}button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #78dcc6;outline-offset:4px}.panel{border:1px solid #293a4e;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#17293a,#101c2b 65%)}.toolbar{padding:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #293a4e}.segments{display:flex;gap:5px;background:#09131f;padding:4px;border-radius:10px}button{background:#1c2c3e;border:1px solid #33485b;border-radius:8px;padding:10px 17px;transition:.25s}button:hover{transform:translateY(-3px);border-color:#78dcc6;box-shadow:0 6px 20px #0004}button.active{background:#78dcc6;color:#0b2525;border-color:#78dcc6}.segments button{border:0;background:transparent}.segments button.active{background:#78dcc6}select{background:#152538;border:1px solid #33485b;padding:10px;border-radius:8px}.stage{position:relative}.stage svg{width:100%;height:350px;display:block}.grid{fill:url(#dots)}.edge{stroke:#30455b;stroke-width:3;fill:none}.route{stroke:var(--accent);stroke-width:5;fill:none;filter:drop-shadow(0 0 5px #78dcc655);stroke-dasharray:12 9;animation:flow 1s linear infinite}.failed{stroke:#ef7e86;stroke-dasharray:5 8;stroke-width:3}.node circle{fill:#192d40;stroke:#4e6a82;stroke-width:2;transition:.3s}.node:hover circle,.node.selected circle{fill:#254d52;stroke:#78dcc6;filter:drop-shadow(0 0 9px #78dcc655)}.node{cursor:pointer}.node text{fill:#ecf4fc;text-anchor:middle;font-size:14px;font-weight:bold}.sub{fill:#829aaf;font-size:11px;text-anchor:middle}.cost{fill:#8da7bc;font-size:12px;text-anchor:middle}.endpoint{fill:#172a3b;stroke:#405a70;stroke-width:1.5}.packet{fill:#fff;filter:drop-shadow(0 0 6px var(--accent))}.badge{position:absolute;top:14px;left:20px;color:#8ba6ba;font-size:10px;letter-spacing:1.5px}.state{position:absolute;top:14px;right:20px;font-size:11px;color:#78dcc6}.bottom{padding:0 20px 20px}.routebox{display:flex;justify-content:space-between;gap:16px;align-items:center;background:#0b1724;border:1px solid #2a3d50;border-radius:12px;padding:18px}.routebox small,.inspector small{display:block;color:#829aaf;letter-spacing:1.4px;font-size:10px;margin-bottom:8px}.routebox strong{font-size:20px;letter-spacing:1px;color:var(--accent)}.metrics{display:flex;gap:23px}.metrics b{font-size:23px;display:block}.metrics span{font-size:10px;color:#829aaf}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.controls button{font-size:12px;padding:9px 12px}.controls label{margin-left:auto;font-size:11px;color:#9eb2c3;display:flex;gap:9px;align-items:center}input{accent-color:#78dcc6;width:90px}.inspector{display:flex;gap:18px;align-items:center;margin-top:16px;border-top:1px solid #293a4e;padding-top:16px}.inspector .icon{font-size:24px;color:#78dcc6}.inspector p{font-size:12px;margin:0;color:#a7bdce;line-height:1.5}.inspector small{margin-bottom:4px}.hint{font-size:10px;color:#71899d;margin-left:auto;text-align:right}.cost-control{display:none;margin:10px 0;color:#9eb2c3;font-size:12px}.cost-control.show{display:block}.tooltip{display:none;position:absolute;pointer-events:none;background:#233a4b;border:1px solid #78dcc6;padding:9px 12px;border-radius:8px;font-size:11px;z-index:3;box-shadow:0 8px 24px #0007}.legend{display:flex;gap:18px;padding:0 20px;color:#8199ae;font-size:10px}.legend i{display:inline-block;width:16px;height:3px;background:var(--accent);vertical-align:middle;margin-right:6px}.legend .down{background:#ef7e86}@keyframes flow{to{stroke-dashoffset:-42}}@media(max-width:600px){.toolbar{padding:12px}.stage svg{height:280px}.badge{font-size:8px;left:12px}.state{right:12px;font-size:9px}.bottom{padding:0 12px 12px}.routebox{padding:13px;gap:8px}.routebox strong{font-size:14px}.metrics{gap:12px}.metrics b{font-size:19px}.hint{display:none}.inspector p{font-size:11px}.controls label{margin-left:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><div class="panel" style="--accent:#f6ae73"><div class="toolbar"><div class="segments" aria-label="Routing protocol"><button id="rip" class="active" aria-pressed="true">RIP</button><button id="ospf" aria-pressed="false">OSPF</button></div><select id="scenario" aria-label="Network scenario"><option value="baseline">Baseline · all links up</option><option value="failover">Link failure · R2–R4 down</option><option value="recovery">Restored · upper link up</option><option value="cost_demo">Cost demo · unequal costs</option></select></div><div class="stage"><span class="badge">ANIMATED ROUTE MODEL</span><span class="state" id="state">● ALL LINKS UP</span><svg viewBox="0 0 1000 360" role="img" aria-label="Five router network with an upper primary path and lower backup path"><defs><pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#304356"/></pattern></defs><rect class="grid" width="1000" height="360"/><path class="edge" d="M60 180H250 M770 180H940 M250 180L490 75L770 180 M250 180L410 285H635L770 180"/><path id="failed" class="failed" d="M490 75L770 180" style="display:none"/><path id="route" class="route" d="M60 180H250L490 75L770 180H940"/><text id="cost1" class="cost" x="360" y="110">1</text><text id="cost2" class="cost" x="645" y="110">1</text><text class="cost" id="cost3" x="310" y="252">1</text><text class="cost" id="cost4" x="525" y="273">1</text><text class="cost" id="cost5" x="715" y="252">1</text><g class="node" data-node="R1" tabindex="0" role="button" aria-label="Inspect R1" transform="translate(250 180)"><circle r="28"/><text y="5">R1</text></g><g class="node" data-node="R2" tabindex="0" role="button" aria-label="Inspect R2" transform="translate(490 75)"><circle r="28"/><text y="5">R2</text></g><g class="node" data-node="R3" tabindex="0" role="button" aria-label="Inspect R3" transform="translate(410 285)"><circle r="28"/><text y="5">R3</text></g><g class="node" data-node="R5" tabindex="0" role="button" aria-label="Inspect R5" transform="translate(635 285)"><circle r="28"/><text y="5">R5</text></g><g class="node" data-node="R4" tabindex="0" role="button" aria-label="Inspect R4" transform="translate(770 180)"><circle r="28"/><text y="5">R4</text></g><rect class="endpoint" x="40" y="163" width="36" height="28" rx="4"/><text class="sub" x="58" y="215">PC-A</text><rect class="endpoint" x="921" y="163" width="36" height="28" rx="4"/><text class="sub" x="939" y="215">PC-B</text><rect class="endpoint" x="132" y="170" width="34" height="20" rx="3"/><text class="sub" x="149" y="215">SW1</text><rect class="endpoint" x="840" y="170" width="34" height="20" rx="3"/><text class="sub" x="857" y="215">SW2</text><text class="sub" x="58" y="233">192.168.10.10</text><text class="sub" x="939" y="233">192.168.20.10</text><circle class="packet" r="5"><animateMotion id="motion" dur="3s" repeatCount="indefinite" path="M60 180H250L490 75L770 180H940"/></circle><circle class="packet" r="3" opacity=".5"><animateMotion id="motion2" dur="3s" begin="-1.5s" repeatCount="indefinite" path="M60 180H250L490 75L770 180H940"/></circle></svg><div class="tooltip" id="tooltip"></div></div><div class="legend"><span><i></i>Selected route</span><span><i class="down"></i>Failed link</span><span>Hover or click a router</span></div><div class="bottom"><div class="cost-control" id="costcontrol"><label>Upper-link OSPF cost <input id="cost" aria-label="Upper link cost" type="range" min="1" max="100" value="100"> <b id="costvalue">100</b></label> · Lower links: 10 each</div><div class="routebox" style="margin-top:16px"><div><small id="route-label">RIP / SELECTED PATH</small><strong id="path" aria-live="polite">R1 → R2 → R4</strong></div><div class="metrics"><div><b id="hops">2</b><span>HOPS</span></div><div><b id="metric">2</b><span id="metric-label">RIP METRIC</span></div></div></div><div class="controls"><button id="break">↯ Fail link</button><button id="replay">↻ Replay experiment</button><button id="pause">Ⅱ Pause</button><label>Speed <input id="speed" aria-label="Animation speed" type="range" min="1" max="3" step=".5" value="1"></label></div><div class="inspector"><span class="icon">◈</span><div><small id="node-title">R1 / SOURCE GATEWAY</small><p id="node-detail">LAN 192.168.10.1 · R2 via 10.0.12.1 · R3 via 10.0.13.1</p></div><span class="hint">Visual playback only<br>No measured timing</span></div></div></div><script>
const $=id=>document.getElementById(id),panel=document.querySelector('.panel'),svg=document.querySelector('svg');let protocol='RIP',paused=false,timers=[];
const nodes={R1:['SOURCE GATEWAY','LAN 192.168.10.1 · R2 via 10.0.12.1 · R3 via 10.0.13.1'],R2:['UPPER PATH','R1 via 10.0.12.2 · R4 via 10.0.24.1'],R3:['BACKUP PATH','R1 via 10.0.13.2 · R5 via 10.0.35.1'],R5:['BACKUP PATH','R3 via 10.0.35.2 · R4 via 10.0.45.1'],R4:['DESTINATION GATEWAY','LAN 192.168.20.1 · R2 via 10.0.24.2 · R5 via 10.0.45.2']};
function stopReplay(){timers.forEach(clearTimeout);timers=[];$('replay').textContent='↻ Replay experiment'}
function update(){let s=$('scenario').value,down=s==='failover',demo=s==='cost_demo',upper=demo?+$('cost').value:1,lower=demo?10:1,backup=down||(protocol==='OSPF'&&2*upper>3*lower);let p=backup?'M60 180H250L410 285H635L770 180H940':'M60 180H250L490 75L770 180H940';panel.style.setProperty('--accent',protocol==='RIP'?'#f6ae73':'#78dcc6');$('route').setAttribute('d',p);['motion','motion2'].forEach(id=>{$(id).setAttribute('path',p);$(id).setAttribute('dur',3/+$('speed').value+'s')});$('failed').style.display=down?'':'none';$('path').textContent=backup?'R1 → R3 → R5 → R4':'R1 → R2 → R4';$('hops').textContent=backup?3:2;$('metric').textContent=protocol==='RIP'?(backup?3:2):(backup?3*lower:2*upper);$('metric-label').textContent=protocol==='RIP'?'RIP METRIC':'MODEL COST';$('route-label').textContent=protocol+' / SELECTED PATH';$('state').textContent=down?'● R2–R4 LINK DOWN':demo?'● UNEQUAL OSPF COSTS':'● ALL LINKS UP';$('state').style.color=down?'#ef7e86':'#78dcc6';$('break').textContent=down?'↗ Restore link':'↯ Fail link';$('costcontrol').classList.toggle('show',demo);$('costvalue').textContent=upper;[1,2].forEach(i=>$('cost'+i).textContent=upper);[3,4,5].forEach(i=>$('cost'+i).textContent=lower);['rip','ospf'].forEach(id=>{$(id).classList.toggle('active',id.toUpperCase()===protocol);$(id).setAttribute('aria-pressed',id.toUpperCase()===protocol)});$('metric').title='OSPF model cost to R4 excludes its LAN interface. Recorded Cisco route includes LAN cost.';}
['rip','ospf'].forEach(id=>$(id).onclick=()=>{stopReplay();protocol=id.toUpperCase();update()});$('scenario').onchange=()=>{stopReplay();update()};$('break').onclick=()=>{stopReplay();$('scenario').value=$('scenario').value==='failover'?'recovery':'failover';update()};$('cost').oninput=update;$('speed').oninput=update;
$('pause').onclick=()=>{paused=!paused;if(paused)svg.pauseAnimations();else svg.unpauseAnimations();$('route').style.animationPlayState=paused?'paused':'running';$('pause').textContent=paused?'▶ Resume':'Ⅱ Pause'};
$('replay').onclick=()=>{if(timers.length){stopReplay();return}$('scenario').value='baseline';update();$('replay').textContent='■ Stop replay';timers.push(setTimeout(()=>{$('scenario').value='failover';update()},3000),setTimeout(()=>{$('scenario').value='recovery';update()},6500),setTimeout(stopReplay,9500))};
document.querySelectorAll('.node').forEach(n=>{let key=n.dataset.node;function inspect(){document.querySelectorAll('.node').forEach(x=>x.classList.remove('selected'));n.classList.add('selected');$('node-title').textContent=key+' / '+nodes[key][0];$('node-detail').textContent=nodes[key][1]+(key==='R2'&&$('scenario').value==='failover'?' · R4 link down':'')}n.onclick=inspect;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect()}};n.onpointermove=e=>{let r=document.querySelector('.stage').getBoundingClientRect(),t=$('tooltip');t.textContent=key+' · '+nodes[key][0];t.style.display='block';t.style.left=Math.min(e.clientX-r.left+12,r.width-180)+'px';t.style.top=e.clientY-r.top-35+'px'};n.onpointerleave=()=>$('tooltip').style.display='none'});if(matchMedia('(prefers-reduced-motion: reduce)').matches)$('pause').click();update();
</script></html>
